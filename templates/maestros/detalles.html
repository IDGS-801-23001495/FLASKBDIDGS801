{% extends "layout.html" %}

{% block container %}

<style>
  .emerald-icon-bg     { background-color: rgba(16, 185, 129, 0.10); border-color: rgba(16, 185, 129, 0.20); }
  .emerald-icon        { color: #059669; }
  .emerald-badge       { background-color: rgba(16, 185, 129, 0.10); border-color: rgba(16, 185, 129, 0.20); color: #047857; }
  .emerald-border-top  { border-top: 3px solid #10b981; }
  .emerald-avatar-ring { border: 4px solid rgba(16, 185, 129, 0.25); }
  .emerald-link        { color: #059669; }
  .emerald-link:hover  { color: #047857; text-decoration: underline; }
  .emerald-spec        { background-color: rgba(16, 185, 129, 0.10); border: 1px solid rgba(16, 185, 129, 0.20); color: #047857; }
  .detail-row          { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
  .detail-row:last-child { border-bottom: none; }
  .detail-label        { font-size: 0.75rem; color: #6b7280; min-width: 6rem; }
</style>

<div class="max-w-md mx-auto mt-10 px-4">

  <div class="flex items-center gap-3 mb-6">
    <div class="emerald-icon-bg flex items-center justify-center w-10 h-10 rounded-xl border">
      <svg class="emerald-icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
    </div>
    <div>
      <h1 class="text-xl font-semibold text-heading leading-tight">Detalles del Maestro</h1>
      <p class="text-xs text-body">Información del docente</p>
    </div>
    <span class="emerald-badge ml-1 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border">
      Perfil
    </span>
  </div>

  <div class="emerald-border-top bg-neutral-primary-soft border border-default rounded-base shadow-xs overflow-hidden">

    <div class="flex flex-col items-center text-center px-8 pt-8 pb-6 border-b border-default">
      <div class="relative mb-4">
        <img class="emerald-avatar-ring w-24 h-24 rounded-full object-cover shadow-sm"
             src="/static/img/jijo.jpeg"
             alt="Foto de {{nombre}}" />
      </div>
      <h2 class="text-xl font-bold text-heading">{{nombre}} {{apellidos}}</h2>

      <span class="emerald-spec mt-2 inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold">
        {{especialidad}}
      </span>
    </div>

    <div class="px-8 py-4">
      <div class="detail-row">
        <svg class="emerald-icon w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
        </svg>
        <span class="detail-label">Matrícula</span>
        <span class="text-sm font-semibold text-heading">{{matricula}}</span>
      </div>
      <div class="detail-row">
        <svg class="emerald-icon w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
        </svg>
        <span class="detail-label">Correo</span>
        <span class="text-sm font-medium text-heading">{{email}}</span>
      </div>
    </div>


    <div class="px-8 py-4 border-t border-default flex items-center gap-3">
      <a href="modificar?matricula={{matricula}}"
        class="emerald-link inline-flex items-center gap-1.5 text-sm font-medium transition-colors">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Z"/>
        </svg>
        Editar
      </a>
      <span class="text-body">·</span>
      <a href="/Maestros"
        class="inline-flex items-center gap-1.5 text-sm font-medium text-body hover:text-heading transition-colors">
        ← Volver a la lista
      </a>
    </div>
  </div>

</div>

{% endblock %}
