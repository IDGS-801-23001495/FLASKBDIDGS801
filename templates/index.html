{% extends "layout.html" %}

{% block container %}

<style>
  .stat-card {
    flex: 1;
    min-width: 0;
    background-color: var(--color-neutral-primary-soft, #fff);
    padding: 2rem 1.75rem;
    transition: background-color 0.15s ease;
  }
  .stat-card:hover { background-color: var(--color-neutral-secondary-medium, #f9fafb); }

  .row-wrap {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--color-border-default, #e5e7eb);
    border-radius: 0.75rem;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .divider { width: 1px; background-color: var(--color-border-default, #e5e7eb); flex-shrink: 0; }

  .num-blue    { color: #1d4ed8; }
  .num-emerald { color: #047857; }
  .num-purple  { color: #6d28d9; }

  .icon-blue    { background-color: rgba(59,130,246,0.08); color: #2563eb; }
  .icon-emerald { background-color: rgba(16,185,129,0.08); color: #059669; }
  .icon-purple  { background-color: rgba(139,92,246,0.08); color: #7c3aed; }

  .link-blue    { color: #2563eb; }
  .link-blue:hover    { color: #1d4ed8; text-decoration: underline; }
  .link-emerald { color: #059669; }
  .link-emerald:hover { color: #047857; text-decoration: underline; }
  .link-purple  { color: #7c3aed; }
  .link-purple:hover  { color: #6d28d9; text-decoration: underline; }

  .bar-blue    { background-color: #3b82f6; }
  .bar-emerald { background-color: #10b981; }
  .bar-purple  { background-color: #8b5cf6; }
  .bar { height: 3px; width: 2rem; border-radius: 9999px; margin-bottom: 1.25rem; }
</style>

<div class="max-w-4xl mx-auto mt-16 px-6 pb-16">


  <div class="row-wrap">

    <div class="stat-card">
      <div class="bar bar-blue"></div>
      <div class="flex items-center gap-2 mb-4">
        <div class="icon-blue w-7 h-7 rounded-md flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-body uppercase tracking-wider">Alumnos</span>
      </div>
      <br>
      <p class="num-blue text-4xl font-black leading-none mb-1">{{alumnos}}</p>
      <br>
      <p class="text-body text-xs mb-6">Estudiantes registrados</p>
      <a href="/Alumnos" class="link-blue inline-flex items-center gap-1 text-xs font-medium">
        Ver lista
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
        </svg>
      </a>
    </div>

    <div class="divider"></div>

    <div class="stat-card">
      <div class="bar bar-emerald"></div>
      <div class="flex items-center gap-2 mb-4">
        <div class="icon-emerald w-7 h-7 rounded-md flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-body uppercase tracking-wider">Maestros</span>
      </div>
      <br>
      <p class="num-emerald text-4xl font-black leading-none mb-1">{{maestros}}</p>
      <br>
      <p class="text-body text-xs mb-6">Docentes registrados</p>
      <a href="/Maestros" class="link-emerald inline-flex items-center gap-1 text-xs font-medium">
        Ver lista
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
        </svg>
      </a>
    </div>

    <div class="divider"></div>

    <div class="stat-card">
      <div class="bar bar-purple"></div>
      <div class="flex items-center gap-2 mb-4">
        <div class="icon-purple w-7 h-7 rounded-md flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-body uppercase tracking-wider">Cursos</span>
      </div>
      <br>
      <p class="num-purple text-4xl font-black leading-none mb-1">{{cursos}}</p>
      <br>
      <p class="text-body text-xs mb-6">Cursos registrados</p>
      <a href="/Cursos" class="link-purple inline-flex items-center gap-1 text-xs font-medium">
        Ver lista
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
        </svg>
      </a>
    </div>

  </div>
</div>

{% endblock %}
