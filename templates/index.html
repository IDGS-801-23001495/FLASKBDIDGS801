{% extends "layout.html" %}

{% block container %}
<div class="py-12 max-w-7xl mx-auto px-6">
    <div class="text-center mb-12">
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Resumen general del sistema</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="bg-white rounded-3xl p-8 border-b-8 border-blue-500 shadow-sm hover:shadow-2xl transition-all duration-300">
            <div class="flex items-center justify-between mb-6">
                <div class="p-4 bg-blue-50 rounded-2xl">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
                </div>
                <span class="text-sm font-bold text-blue-500 tracking-widest uppercase">Población Estudiantil</span>
            </div>
            <div>
                <p class="text-5xl font-black text-slate-800">{{alumnos}}</p>
                <p class="text-slate-500 font-medium mt-1">Alumnos registrados</p>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-8 border-b-8 border-emerald-500 shadow-sm hover:shadow-2xl transition-all duration-300">
            <div class="flex items-center justify-between mb-6">
                <div class="p-4 bg-emerald-50 rounded-2xl">
                    <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                </div>
                <span class="text-sm font-bold text-emerald-500 tracking-widest uppercase">Cuerpo Docente</span>
            </div>
            <div>
                <p class="text-5xl font-black text-slate-800">{{maestros}}</p>
                <p class="text-slate-500 font-medium mt-1">Maestros registrados</p>
            </div>
        </div>

    </div>

</div>
{% endblock %}
