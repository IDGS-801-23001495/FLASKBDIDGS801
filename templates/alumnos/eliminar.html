{% extends "layout.html" %}

{% block container %}

<style>
  .blue-icon-bg     { background-color: rgba(59, 130, 246, 0.10); border-color: rgba(59, 130, 246, 0.20); }
  .blue-icon        { color: #3b82f6; }
  .danger-badge     { background-color: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.25); color: #dc2626; }
  .danger-border    { border-top: 3px solid #ef4444; }
  .danger-banner    { background-color: rgba(239, 68, 68, 0.07); border: 1px solid rgba(239, 68, 68, 0.20); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1.5rem; }
  .danger-icon      { color: #ef4444; }
  .danger-btn       { background-color: #dc2626; color: #fff; }
  .danger-btn:hover { background-color: #b91c1c; }
  .cancel-btn       { background-color: transparent; color: #6b7280; border: 1px solid #d1d5db; }
  .cancel-btn:hover { background-color: #f3f4f6; color: #374151; }
  .field-readonly   { opacity: 0.6; pointer-events: none; }
</style>

<div class="max-w-2xl mx-auto mt-10 px-4">


    <div class="flex items-center gap-3 mb-6">
    <div class="blue-icon-bg flex items-center justify-center w-10 h-10 rounded-xl border">
      <svg class="blue-icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
      </svg>
    </div>
    <div>
      <h1 class="text-xl font-semibold text-heading leading-tight">Eliminar Alumno</h1>
      <p class="text-xs text-body">Esta acción no se puede deshacer</p>
    </div>
    <span class="danger-badge ml-1 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border">
      Peligro
    </span>
  </div>


  <div class="danger-border bg-neutral-primary-soft border border-default rounded-base shadow-xs p-8">
    <form action="#" method="post">
      <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
      <input type="hidden" name="id" id="id" value="{{form.id.data}}">


      <div class="danger-banner flex items-start gap-3">
        <svg class="danger-icon w-5 h-5 mt-0.5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
        <p class="text-sm text-body">¿Estás seguro de que deseas eliminar a este alumno? Se borrarán todos sus datos permanentemente.</p>
      </div>


      <div class="field-readonly grid md:grid-cols-2 md:gap-8">
        <div class="relative z-0 w-full mb-8 group">
          <input type="text" name="nombre" value="{{form.nombre.data}}" id="floating_first_name" readonly
            class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 peer"
            placeholder=" " />
          <label for="floating_first_name"
            class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0]">
            Nombre(s)
          </label>
        </div>
        <div class="relative z-0 w-full mb-8 group">
          <input type="text" name="apellidos" value="{{form.apellidos.data}}" id="floating_last_name" readonly
            class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 peer"
            placeholder=" " />
          <label for="floating_last_name"
            class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0]">
            Apellidos
          </label>
        </div>
      </div>

      <div class="field-readonly relative z-0 w-full mb-8 group">
        <input type="email" name="correo" value="{{form.correo.data}}" id="floating_email" readonly
          class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 peer"
          placeholder=" " />
        <label for="floating_email"
          class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0]">
          Correo Electrónico
        </label>
      </div>

      <div class="field-readonly relative z-0 w-full mb-10 group">
        <input type="number" name="telefono" value="{{form.telefono.data}}" id="telefono" readonly
          class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 peer"
          placeholder=" " />
        <label for="telefono"
          class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0]">
          Teléfono
        </label>
      </div>


      <div class="flex items-center gap-3">
        <button type="submit"
          class="danger-btn inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-medium rounded-base active:scale-95 transition-all duration-150 shadow-sm focus:outline-none">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
          Sí, Eliminar
        </button>
        <a href="/Alumnos"
          class="cancel-btn inline-flex items-center gap-1.5 px-5 py-2.5 text-sm font-medium rounded-base active:scale-95 transition-all duration-150 focus:outline-none">
          Cancelar
        </a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
