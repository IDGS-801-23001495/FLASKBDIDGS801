{% extends "layout.html" %}

{% block container %}

<style>
  .blue-icon-bg    { background-color: rgba(59, 130, 246, 0.10); border-color: rgba(59, 130, 246, 0.20); }
  .blue-icon       { color: #3b82f6; }
  .blue-badge      { background-color: rgba(59, 130, 246, 0.10); border-color: rgba(59, 130, 246, 0.20); color: #2563eb; }
  .blue-border-top { border-top: 3px solid #3b82f6; }
  .blue-avatar-ring { border: 4px solid rgba(59, 130, 246, 0.25); }
  .blue-link       { color: #2563eb; }
  .blue-link:hover { color: #1d4ed8; text-decoration: underline; }
  .detail-row      { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
  .detail-row:last-child { border-bottom: none; }
  .detail-label    { font-size: 0.75rem; color: #6b7280; min-width: 6rem; }
  .detail-value    { font-size: 0.875rem; font-weight: 500; }
</style>

<div class="max-w-md mx-auto mt-10 px-4">

  <div class="flex items-center gap-3 mb-6">
    <div class="blue-icon-bg flex items-center justify-center w-10 h-10 rounded-xl border">
      <svg class="blue-icon w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
      </svg>
    </div>
    <div>
      <h1 class="text-xl font-semibold text-heading leading-tight">Detalles del Alumno</h1>
      <p class="text-xs text-body">Información del estudiante</p>
    </div>
    <span class="blue-badge ml-1 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border">
      Perfil
    </span>
  </div>

  <div class="blue-border-top bg-neutral-primary-soft border border-default rounded-base shadow-xs overflow-hidden">

    <div class="flex flex-col items-center text-center px-8 pt-8 pb-6 border-b border-default">
      <div class="relative mb-4">
        <img class="blue-avatar-ring w-24 h-24 rounded-full object-cover shadow-sm"
             src="/static/img/jijo.jpeg"
             alt="Foto de {{nombre}}" />
      </div>
      <h2 class="text-xl font-bold text-heading">{{nombre}} {{apellidos}}</h2>
      <span class="blue-badge mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border">
        Estudiante
      </span>
    </div>

    <div class="px-8 py-4">
      <div class="detail-row">
        <svg class="blue-icon w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
        </svg>
        <span class="detail-label">Correo</span>
        <span class="detail-value text-heading">{{email}}</span>
      </div>
      <div class="detail-row">
        <svg class="blue-icon w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
        </svg>
        <span class="detail-label">Teléfono</span>
        <span class="detail-value text-heading">{{telefono}}</span>
      </div>
    </div>

    <div class="px-8 py-4 border-t border-default flex items-center gap-3">
      <a href="modificar?id={{id}}"
        class="blue-link inline-flex items-center gap-1.5 text-sm font-medium transition-colors">
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Z"/>
        </svg>
        Editar
      </a>
      <span class="text-default-medium">·</span>
      <a href="/Alumnos"
        class="inline-flex items-center gap-1.5 text-sm font-medium text-body hover:text-heading transition-colors">
        ← Volver a la lista
      </a>
    </div>
  </div>

</div>

{% endblock %}
